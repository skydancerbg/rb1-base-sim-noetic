# Logitech F710 in DirectInput mode (D switch, mode LED off).
pad_type: logitechf710
num_of_buttons: 11

axis_linear_x: 1
axis_linear_y: 0
axis_angular: 3
axis_linear_z: 5

# Conservative manual-mapping speeds.
scale_linear: 0.35
scale_angular: 0.8
scale_linear_z: 0.0

button_speed_up: 3
button_speed_down: 0
button_dead_man: 5
button_output_1: 2
button_output_2: 1
output_1: 10
output_2: 11

button_kinematic_mode: 7
cmd_service_home: /robot_controller/home
check_message_timeout: false
